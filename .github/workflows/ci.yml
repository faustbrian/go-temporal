name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      verifier_diagnostic:
        description: Qualify corrected root-module verifier, not release CI
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || !inputs.verifier_diagnostic
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@14d1e594d5f246a795d0c0c11cf7d2d6c8e5617f # v1.6.1
    with:
      tooling_sha: 14d1e594d5f246a795d0c0c11cf7d2d6c8e5617f
      # The published baseline remains ordinary CI, not a second release run.
      release_dry_run: false

  verifier-diagnostic:
    name: Source-built tooling qualification (not a Tools release)
    if: github.event_name == 'workflow_dispatch' && (inputs.verifier_diagnostic || inputs.release_dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - name: Reject conflicting qualification selectors
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
          VERIFIER_DIAGNOSTIC: ${{ inputs.verifier_diagnostic }}
        run: |
          if [[ "${RELEASE_DRY_RUN}" == true && "${VERIFIER_DIAGNOSTIC}" == true ]]; then
            echo 'release rehearsal and verifier diagnostic are separate selections' >&2
            exit 1
          fi
      - name: Initialize task-owned resources
        env:
          TASK_ROOT: ${{ runner.temp }}/temporal-verifier-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint"
          for kind in container network volume image; do
            case "${kind}" in
              container|image) flags=(--all --quiet --no-trunc) ;;
              network) flags=(--quiet --no-trunc) ;;
              volume) flags=(--quiet) ;;
            esac
            docker "${kind}" ls "${flags[@]}" | sort -u >"${TASK_ROOT}/initial-${kind}.pending"
            mv "${TASK_ROOT}/initial-${kind}.pending" "${TASK_ROOT}/initial-${kind}"
          done
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nTMPDIR=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/tmp" >>"${GITHUB_ENV}"
      - name: Check out exact producer with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out reviewed corrected tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 67b405ff04390d044e239cfd737c45ceb5e60447
          path: verifier-tooling
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build development qualification tooling
        timeout-minutes: 15
        working-directory: verifier-tooling
        run: go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
      - name: Run native security and bounded checks for all declared modules
        if: inputs.verifier_diagnostic
        timeout-minutes: 60
        working-directory: producer
        run: '"${GOTMPDIR}/golib" check --local --all'
      - name: Verify existing five-second JSON size oracle
        if: inputs.verifier_diagnostic
        timeout-minutes: 5
        working-directory: producer
        run: go test -p 1 ./adapters/wire -run '^TestJSONStringSizeMatchesStandardEncodingWithoutChangingRepresentation$' -count=1 -timeout=60s
      - name: Verify corrected source-directory backend regression
        if: inputs.verifier_diagnostic
        timeout-minutes: 10
        working-directory: verifier-tooling
        run: go test -p 1 -tags=verifierintegration ./internal/mutation -run '^TestPatchedVerifierResolvesPackageDirectories$' -count=1 -timeout=5m
      - name: Verify union admission and exact counterfactual sensitivity
        if: inputs.verifier_diagnostic
        timeout-minutes: 10
        working-directory: producer
        env:
          TEMPORAL_VERIFY_UNION_ADMISSION: 'true'
        run: |
          set -euo pipefail
          proof_root=$(mktemp -d "${GOTMPDIR}/union-admission.XXXXXX")
          trap 'find "${proof_root}" -type d -exec chmod u+w {} +; find "${proof_root}" -depth -delete' EXIT
          test_name=TestDateSetUnionRefusesBeforeCombiningInputs
          go test -p 1 ./dateperiod -run "^${test_name}$" -count=1 -timeout=60s -json | tee "${proof_root}/baseline.json"
          jq -s -e --arg test "${test_name}" '
            ([.[] | select(.Test == $test and .Action == "pass")] | length) == 1 and
            ([.[] | select(.Test == $test and .Action == "skip")] | length) == 0
          ' "${proof_root}/baseline.json"
          mkdir "${proof_root}/counterfactual"
          git archive --format=tar HEAD | tar -xf - -C "${proof_root}/counterfactual"
          perl -0pi -e '
            my $old = "\tinputCount := len(s.periods) + len(other.periods)\n";
            my $new = "\tinputCount := len(s.periods) - len(other.periods)\n";
            my $count = s/\Q$old\E/$new/g;
            die "counterfactual source mismatch\n" unless $count == 1;
          ' "${proof_root}/counterfactual/dateperiod/set.go"
          if (cd "${proof_root}/counterfactual" && go test -p 1 ./dateperiod -run "^${test_name}$" -count=1 -timeout=60s -json) >"${proof_root}/counterfactual.json"; then
            printf 'expected union admission counterfactual failure\n' >&2
            exit 1
          fi
          jq -s -e --arg test "${test_name}" '
            ([.[] | select(.Test == $test and .Action == "fail")] | length) == 1 and
            any(.[]; .Test == $test and .Action == "output" and
              (.Output | contains("Union allocated before refusing input_periods")))
          ' "${proof_root}/counterfactual.json"
          git diff --exit-code -- dateperiod/set.go
      - name: Qualify mutation for all thirteen root-module packages
        if: inputs.verifier_diagnostic
        timeout-minutes: 140
        working-directory: producer
        env:
          TEMPORAL_VERIFY_UNION_ADMISSION: 'true'
        run: '"${GOTMPDIR}/golib" mutation --module .'
      - name: Require the viable wire boundary mutant to be killed
        if: inputs.verifier_diagnostic
        working-directory: producer
        run: |
          set -euo pipefail
          jq -s -e '
            [.[].files[] | select(.file_name == "wire.go") | .mutations[] |
              select(.type == "CONDITIONALS_BOUNDARY" and .line == 197 and .column == 17)] as $results |
            ($results | length) > 0 and all($results[]; .status == "KILLED")
          ' .verification/mutation/reports/*.json
      - name: Validate root release contract with integrated source tooling
        if: inputs.release_dry_run
        timeout-minutes: 5
        working-directory: producer
        run: '"${GOTMPDIR}/golib" release check --module .'
      - name: Rehearse root release with integrated source tooling
        if: inputs.release_dry_run
        timeout-minutes: 300
        working-directory: producer
        env:
          TEMPORAL_VERIFY_UNION_ADMISSION: 'true'
        # The supported dry-run validates real evidence and runs every selected
        # gate when reusable evidence is absent. Its candidate proxy is not a
        # published module or public SumDB consumer proof.
        run: '"${GOTMPDIR}/golib" release dry-run --module .'
      - name: Remove task-owned services and qualification resources
        if: always()
        timeout-minutes: 5
        env:
          TASK_ROOT: ${{ runner.temp }}/temporal-verifier-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # Only newly acquired IDs on this dedicated runner are task-owned.
          # Never prune Docker or remove pre-existing runner resources.
          cleanup_status=0
          for kind in container network volume image; do
            if [[ ! -f "${TASK_ROOT}/initial-${kind}" ]]; then
              continue
            fi
            case "${kind}" in
              container) flags=(--all --quiet --no-trunc); removal=(--force --volumes) ;;
              network) flags=(--quiet --no-trunc); removal=() ;;
              volume) flags=(--quiet); removal=() ;;
              image) flags=(--all --quiet --no-trunc); removal=() ;;
            esac
            if docker "${kind}" ls "${flags[@]}" | sort -u >"${TASK_ROOT}/final-${kind}"; then
              if comm -13 "${TASK_ROOT}/initial-${kind}" "${TASK_ROOT}/final-${kind}" >"${TASK_ROOT}/owned-${kind}"; then
                xargs -r docker "${kind}" rm "${removal[@]}" <"${TASK_ROOT}/owned-${kind}" || cleanup_status=1
              else
                cleanup_status=1
              fi
            else
              cleanup_status=1
            fi
          done
          for target in "${TASK_ROOT}" "${GITHUB_WORKSPACE}/producer" "${GITHUB_WORKSPACE}/verifier-tooling"; do
            if [[ -d "${target}" ]]; then
              find "${target}" -type d -exec chmod u+w {} + || cleanup_status=1
              find "${target}" -depth -delete || cleanup_status=1
            fi
          done
          exit "${cleanup_status}"

  postgres:
    name: PostgreSQL 18.6 release interoperability
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true && !inputs.verifier_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: temporal
          POSTGRES_PASSWORD: temporal
          POSTGRES_DB: temporal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U temporal -d temporal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify canonical and retained PostgreSQL adapters
        shell: bash
        env:
          TEMPORAL_POSTGRES_DSN: postgres://temporal:temporal@localhost:5432/temporal_test?sslmode=disable
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test -n "${TEMPORAL_POSTGRES_DSN}"
          task_cache=$(mktemp -d "${RUNNER_TEMP}/temporal-postgres.XXXXXX")
          trap 'find "$task_cache" -type d -exec chmod u+w {} +; find "$task_cache" -depth -delete' EXIT
          export GOCACHE="$task_cache/build" GOMODCACHE="$task_cache/modules" GOTMPDIR="$task_cache/tmp"
          mkdir "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR"
          go test -tags=integration ./adapters/postgres ./postgres -run '^TestPostgreSQLRangeAndMultirangeRoundTrips$' -count=1 -timeout=120s -json | tee "$task_cache/tests.json"
          jq -s -e '
            ([.[] | select(.Test == "TestPostgreSQLRangeAndMultirangeRoundTrips" and .Action == "pass") | .Package] | sort) ==
            ["github.com/faustbrian/go-temporal/v2/adapters/postgres", "github.com/faustbrian/go-temporal/v2/postgres"] and
            ([.[] | select(.Test == "TestPostgreSQLRangeAndMultirangeRoundTrips" and .Action == "skip")] | length) == 0
          ' "$task_cache/tests.json"

  required:
    name: Required
    if: always()
    needs: [ci, postgres, verifier-diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          QUALIFICATION_RESULT: ${{ needs.verifier-diagnostic.result }}
          RELEASE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true }}
        run: |
          test "${CI_RESULT}" = success
          if [ "${RELEASE_SELECTED}" = true ]; then
            test "${POSTGRES_RESULT}" = success
            test "${QUALIFICATION_RESULT}" = success
          else
            test "${POSTGRES_RESULT}" = skipped
            test "${QUALIFICATION_RESULT}" = skipped
          fi
